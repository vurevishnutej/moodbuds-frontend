spring:
  application:
    name: moodbuds-api
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true
      hibernate.hbm2ddl.auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baselineOnMigrate: true
    baselineVersion: 0
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${MOODBUDS_MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MOODBUDS_MEDIA_MAX_REQUEST_SIZE:50MB}

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,h2-console

moodbuds:
  security:
    jwt-secret: ${MOODBUDS_JWT_SECRET:12345678901234567890123456789012}
    token-validity: ${MOODBUDS_ADMIN_TOKEN_VALIDITY:PT8H}
    customer-access-token-validity: ${MOODBUDS_CUSTOMER_ACCESS_TOKEN_VALIDITY:PT15M}
    customer-refresh-token-validity: ${MOODBUDS_CUSTOMER_REFRESH_TOKEN_VALIDITY:P30D}
    allowed-origins: ${MOODBUDS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  razorpay:
    key-id: ${MOODBUDS_RAZORPAY_KEY_ID:}
    key-secret: ${MOODBUDS_RAZORPAY_KEY_SECRET:}
    base-url: ${MOODBUDS_RAZORPAY_BASE_URL:https://api.razorpay.com}
    checkout-name: ${MOODBUDS_RAZORPAY_CHECKOUT_NAME:MoodBuds}
    checkout-description: ${MOODBUDS_RAZORPAY_CHECKOUT_DESCRIPTION:MoodBuds order}
    theme-color: ${MOODBUDS_RAZORPAY_THEME_COLOR:#111827}
  orders:
    payment-timeout: ${MOODBUDS_PAYMENT_TIMEOUT:PT15M}
    payment-timeout-batch-size: ${MOODBUDS_PAYMENT_TIMEOUT_BATCH_SIZE:100}
    payment-timeout-scan-interval: ${MOODBUDS_PAYMENT_TIMEOUT_SCAN_INTERVAL:PT1M}
    payment-timeout-scan-initial-delay: ${MOODBUDS_PAYMENT_TIMEOUT_SCAN_INITIAL_DELAY:PT30S}
  refunds:
    polling-batch-size: ${MOODBUDS_REFUND_POLLING_BATCH_SIZE:100}
    polling-interval: ${MOODBUDS_REFUND_POLLING_INTERVAL:PT5M}
    polling-initial-delay: ${MOODBUDS_REFUND_POLLING_INITIAL_DELAY:PT1M}
  media:
    root: ${MOODBUDS_MEDIA_ROOT:C:/moodbuds}
    max-image-size-bytes: ${MOODBUDS_MEDIA_MAX_IMAGE_BYTES:5242880}
    max-images-per-upload: ${MOODBUDS_MEDIA_MAX_IMAGES_PER_UPLOAD:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

