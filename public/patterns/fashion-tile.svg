<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <g id="fp-dress" stroke="#1a1a2e" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -3.1,-9.9 C -3.1,-11.8 3.1,-11.8 3.1,-9.9 L 3.1,-6.2 C 6.2,-4.3 9.3,1.9 10.5,8.7 C 10.5,9.9 -10.5,9.9 -10.5,8.7 C -9.3,1.9 -6.2,-4.3 -3.1,-6.2 Z" />
      <path d="M -3.1,-9.9 L -5.6,-13.6" />
      <path d="M 3.1,-9.9 L 5.6,-13.6" />
      <path d="M -4.3,-3.1 L 4.3,-3.1" />
    </g>
    <g id="fp-heel" stroke="#1a1a2e" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -8.7,-1.2 C -8.7,-4.3 -5.6,-5.6 -1.2,-5 L 6.2,-4 C 7.4,-3.7 7.4,-1.9 5.6,-1.2 L 1.9,0.6" />
      <path d="M -8.7,-1.2 C -9.9,1.9 -8.1,4.3 -3.7,4.3 L 5,4.3" />
      <path d="M 5,4.3 L 8.1,-3.7" />
    </g>
    <g id="fp-glasses" stroke="#1a1a2e" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-5.6" cy="0" r="4" />
      <circle cx="5.6" cy="0" r="4" />
      <path d="M -1.6,-0.6 C -0.6,-1.6 0.6,-1.6 1.6,-0.6" />
      <path d="M -9.6,-0.9 L -12.4,-2.8" />
      <path d="M 9.6,-0.9 L 12.4,-2.8" />
    </g>
    <g id="fp-bag" stroke="#1a1a2e" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -3.7,-8.7 C -3.7,-12.4 3.7,-12.4 3.7,-8.7 L 3.7,-6.8" />
      <path d="M -7.4,-6.8 L -8.7,3.7 L 8.7,3.7 L 7.4,-6.8 Z" />
      <path d="M -3.7,-1.9 L 3.7,-1.9" />
    </g>
    <g id="fp-lipstick" stroke="#1a1a2e" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-3.1" y="1.2" width="6.2" height="8.1" rx="1" />
      <path d="M -3.1,1.2 L -2,-6.2 L 2,-6.2 L 3.1,1.2" />
      <path d="M -2,-6.2 L -1,-9.3 L 1,-9.3 L 2,-6.2" />
    </g>
    <g id="fp-bow" stroke="#1a1a2e" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -1.9,0 L -8.7,-4.3 L -8.7,4.3 Z" />
      <path d="M 1.9,0 L 8.7,-4.3 L 8.7,4.3 Z" />
      <rect x="-1.9" y="-1.9" width="3.7" height="3.7" rx="0.6" />
    </g>
    <g id="fp-perfume" stroke="#1a1a2e" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -4.3,9.9 L -4.3,-1.9 L -2.5,-4.3 L 2.5,-4.3 L 4.3,-1.9 L 4.3,9.9 Z" />
      <rect x="-1.9" y="-7.4" width="3.7" height="3.1" />
      <path d="M -1.2,-7.4 L -1.2,-9.3 L 1.2,-9.3 L 1.2,-7.4" />
    </g>
    <g id="fp-necklace" stroke="#1a1a2e" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -8.7,-3.7 C -8.7,4 8.7,4 8.7,-3.7" />
      <path d="M 0,4 L -2,7.4 L 2,7.4 Z" />
      <circle cx="-6.8" cy="-0.3" r="0.7" fill="#1a1a2e" stroke="none" />
      <circle cx="6.8" cy="-0.3" r="0.7" fill="#1a1a2e" stroke="none" />
    </g>
    <g id="fp-hanger" stroke="#1a1a2e" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-6.8" r="1.2" />
      <path d="M 0,-5.6 L 0,-4" />
      <path d="M -9,4 C -9,-1.9 -3.1,-4 0,-4 C 3.1,-4 9,-1.9 9,4" />
      <path d="M -6.8,4 L 6.8,4" />
    </g>
  </defs>

  <!--
    Uniform 4x4 grid, 60x60 cells, tightly repeating like a fabric print.
    Icons are small (~20px footprint) with just a few degrees of rotation
    per cell for a hand-printed feel while staying grid-aligned.
  -->
  <g opacity="0.28">
    <use href="#fp-dress"    x="30"  y="30"  transform="rotate(-4 30 30)" />
    <use href="#fp-heel"     x="90"  y="30"  transform="rotate(6 90 30)" />
    <use href="#fp-glasses"  x="150" y="30"  transform="rotate(-3 150 30)" />
    <use href="#fp-bag"      x="210" y="30"  transform="rotate(5 210 30)" />

    <use href="#fp-lipstick" x="30"  y="90"  transform="rotate(7 30 90)" />
    <use href="#fp-necklace" x="90"  y="90"  transform="rotate(-5 90 90)" />
    <use href="#fp-bow"      x="150" y="90"  transform="rotate(4 150 90)" />
    <use href="#fp-perfume"  x="210" y="90"  transform="rotate(-6 210 90)" />

    <use href="#fp-glasses"  x="30"  y="150" transform="rotate(5 30 150)" />
    <use href="#fp-bag"      x="90"  y="150" transform="rotate(-4 90 150)" />
    <use href="#fp-dress"    x="150" y="150" transform="rotate(3 150 150)" />
    <use href="#fp-hanger"   x="210" y="150" transform="rotate(-5 210 150)" />

    <use href="#fp-bow"      x="30"  y="210" transform="rotate(-6 30 210)" />
    <use href="#fp-perfume"  x="90"  y="210" transform="rotate(4 90 210)" />
    <use href="#fp-heel"     x="150" y="210" transform="rotate(-3 150 210)" />
    <use href="#fp-necklace" x="210" y="210" transform="rotate(6 210 210)" />
  </g>
</svg>
